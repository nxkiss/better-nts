<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Better NTS</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <h1 class="head__title">Player style</h1>
    <p class="head__sub">Better NTS</p>
  </header>

  <form class="modes" id="modes">
    <label class="mode">
      <input type="radio" name="mode" value="original">
      <span class="mode__body">
        <span class="mode__name">Original NTS</span>
        <span class="mode__desc">NTS exactly as it is. The extension changes nothing.</span>
      </span>
    </label>
    <label class="mode">
      <input type="radio" name="mode" value="enhanced">
      <span class="mode__body">
        <span class="mode__name">Enhanced</span>
        <span class="mode__desc">NTS's layout, plus the full clickable tracklist, save on every track, track skipping, volume, markers and shortcuts.</span>
      </span>
    </label>
    <label class="mode">
      <input type="radio" name="mode" value="redesign">
      <span class="mode__body">
        <span class="mode__name">Redesign</span>
        <span class="mode__desc">Everything in Enhanced, in a full-width player bar with the current track, and a tall side drawer for the tracklist and Up Next.</span>
      </span>
    </label>
  </form>

  <div class="options">
    <label class="mode">
      <input type="checkbox" id="notify">
      <span class="mode__body">
        <span class="mode__name">New episode notifications <span class="mode__state"></span></span>
        <span class="mode__desc">A desktop notification when a show you follow has a new episode. Checks every hour. After switching it on, open nts.live once while signed in.</span>
      </span>
    </label>
  </div>

  <p class="foot">Press <kbd>?</kbd> in the player for keyboard shortcuts.</p>

  <script src="popup.js"></script>
</body>
</html>
